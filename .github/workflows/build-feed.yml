name: Build Google feed from WooCommerce

on:
  schedule:
    # 18:17 UTC = 20:17/21:17 Riga. GitHub starts this cron up to ~7.5 h late, and Merchant Center
    # fetches at 06:00 Riga, so an evening start still lands before the fetch.
    - cron: "17 18 * * *"
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python3 tools/build_feed.py feed/google-lv.xml

      - name: Commit feed if it changed
        run: |
          if git diff --quiet -- feed/google-lv.xml; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/google-lv.xml
          git commit -m "Update Google feed from WooCommerce"
          git push
