name: Uptime monitor (marmarcandles.com)

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/uptime_check.py || true
