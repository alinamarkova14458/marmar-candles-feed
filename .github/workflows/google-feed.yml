name: Google Merchant feed

on:
  schedule:
    - cron: '17 3 * * *'   # daily ~05:17–06:17 Riga time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python generate_google_feed.py
      - name: Commit feed if changed
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add google_feed.xml
          git diff --cached --quiet || (git commit -m "Update Google feed" && git push)
